name: Reproducibility
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-released-summaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check released file hashes
        run: sha256sum -c MANIFEST.sha256
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify manuscript result anchors
        run: python analysis_extras/check_summaries.py
      - name: Regenerate main figures
        run: python code/render_figures.py --output-dir generated/figures
      - name: Reproduce the ranking-bias illustration
        run: python analysis_extras/ranking_bias.py --output generated/ranking_bias.csv
